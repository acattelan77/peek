name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject branches based on the pre-2026-11-25 history
        # The repository was recreated with a cleaned history on 2026-11-25.
        # A branch from an older clone would bring the removed data back.
        run: |
          if git cat-file -e eff827e87253a0b6b10f20775385c9f3e287cbdb^{commit} 2>/dev/null; then
            echo "This branch contains the old repository history. Clone the repository again and re-apply your changes." >&2
            exit 1
          fi

      - name: Check for personal data
        # The repository is public. Scans tracked files and, for a pull request
        # or a push, the author, committer and message of each new commit.
        env:
          PERSONAL_DATA_DENYLIST: ${{ secrets.PERSONAL_DATA_DENYLIST }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # GitHub's temporary merge commit for a pull request is not checked: it is
          # never pushed, and its author is set by GitHub.
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 ./scripts/check-personal-data.py --commits "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 ./scripts/check-personal-data.py
          fi

      - name: Validate version metadata
        run: ./scripts/check-version.sh

      - name: Check design-system tokens
        run: ./scripts/check-design-tokens.sh

      - name: Check localization tables
        run: python3 ./scripts/check-localization.py

      - name: Validate release-relevant version bump
        if: github.event_name == 'pull_request'
        run: ./scripts/check-version-bump.sh "${{ github.event.pull_request.base.sha }}"

      - name: Validate release-relevant version bump on push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: ./scripts/check-version-bump.sh "${{ github.event.before }}"

      - name: Build (unsigned)
        run: |
          xcodebuild -scheme "Peek" -configuration Debug -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Check App Store bundle requirements
        run: ./scripts/check-app-bundle.sh build/Build/Products/Debug/Peek.app

      - name: Test (unsigned)
        run: |
          xcodebuild -scheme "Peek" -destination "platform=macOS" -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test
